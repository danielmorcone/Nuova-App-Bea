<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="respira.">

    <link rel="apple-touch-icon" href="../assets/icons/icona.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/radicamento.css">

    <title>Radicamento — respira.</title>
    <script type="module" src="../assets/js/radicamento.js"></script>
</head>

<body class="grounding-page">
    <main class="grounding-screen">
        <header class="grounding-header">
            <a class="grounding-back" href="../index.html" aria-label="Interrompi e torna alla Home">
                <i class="bi bi-caret-left-fill" aria-hidden="true"></i>
            </a>
            <h1>Radicamento</h1>
            <p>Torniamo qui, piano piano</p>
            <div class="grounding-divider" aria-hidden="true"></div>
        </header>

        <form class="grounding-content" id="grounding-form">
            <p class="grounding-step-number" id="grounding-step-number">1</p>
            <h2 class="grounding-step-title" id="grounding-step-title" aria-live="polite">Guarda intorno a te</h2>
            <p class="grounding-step-description" id="grounding-step-description">Prova a trovare tre cose che puoi vedere. possono essere qualsiasi cosa, anche le più piccole.</p>
            <label class="visually-hidden" id="grounding-answer-label" for="grounding-answer">Scrivi qui la tua risposta</label>
            <input class="grounding-answer" id="grounding-answer" type="text" maxlength="180" placeholder="Tocca qui per scrivere..." autocomplete="off" enterkeyhint="done">
        </form>

        <button class="grounding-previous" id="grounding-previous" type="button" hidden>Indietro</button>
        <button class="grounding-next" id="grounding-next" type="submit" form="grounding-form">Invia</button>
    </main>

    <dialog class="grounding-confirm" id="grounding-confirm" aria-labelledby="grounding-confirm-title" aria-describedby="grounding-confirm-description">
        <h2 id="grounding-confirm-title">Sicura di voler tornare?</h2>
        <p id="grounding-confirm-description">Hai interrotto l'esercizio. Scegli No per riprendere oppure S&igrave; per tornare alla Home.</p>
        <div class="grounding-confirm__actions">
            <button class="grounding-confirm__button" id="grounding-confirm-yes" type="button">S&igrave;</button>
            <button class="grounding-confirm__button grounding-confirm__button--no" id="grounding-confirm-no" type="button">No</button>
        </div>
    </dialog>

    <div class="waves" aria-hidden="true">
        <img src="../assets/images/waves/wave1.png" class="wave1" alt="">
        <img src="../assets/images/waves/wave2.png" class="wave2" alt="">
        <img src="../assets/images/waves/wave3.png" class="wave3" alt="">
    </div>
</body>

</html>
