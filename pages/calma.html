<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="respira.">

    <link rel="apple-touch-icon" href="../assets/icons/icona.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/calma.css">

    <title>Respiro — respira.</title>
    <script type="module" src="../assets/js/calma.js"></script>
</head>

<body class="calm-page">
    <main class="calm-screen">
        <header class="calm-header">
            <a class="calm-icon-button calm-back" href="../index.html" aria-label="Torna alla Home">
                <i class="bi bi-caret-left-fill" aria-hidden="true"></i>
            </a>

            <div class="calm-heading">
                <h1>Respiro</h1>
                <p>Prova a rilassarti, passerà.</p>
            </div>

            <button class="calm-icon-button calm-info-button" id="open-info" type="button" aria-label="Come funziona la respirazione" aria-haspopup="dialog">
                <span aria-hidden="true">i</span>
            </button>
        </header>

        <section class="calm-breath" aria-label="Respirazione guidata">
            <div class="calm-breath__rings" id="breath-rings" data-phase="idle">
                <div class="calm-breath__ring calm-breath__ring--outer" aria-hidden="true"></div>
                <div class="calm-breath__ring calm-breath__ring--middle" aria-hidden="true"></div>
                <div class="calm-breath__core">
                    <p class="calm-breath__phase" id="breath-phase" aria-live="polite">Inspira</p>
                    <p class="calm-breath__count" id="breath-count">4 secondi</p>
                </div>
            </div>
        </section>

        <section class="calm-guide" aria-labelledby="guide-title">
            <h2 id="guide-title">Come funziona</h2>
            <ol class="calm-guide__steps">
                <li class="calm-guide__step" data-step="inhale" data-icon="bi-chevron-up">
                    <span class="calm-guide__icon" aria-hidden="true"><i class="bi bi-chevron-up"></i></span>
                    <span class="calm-guide__name">Inspira</span>
                    <span class="calm-guide__duration">4 secondi</span>
                </li>
                <li class="calm-guide__step" data-step="hold" data-icon="bi-pause">
                    <span class="calm-guide__icon" aria-hidden="true"><i class="bi bi-pause"></i></span>
                    <span class="calm-guide__name">Trattieni</span>
                    <span class="calm-guide__duration">2 secondi</span>
                </li>
                <li class="calm-guide__step" data-step="exhale" data-icon="bi-chevron-down">
                    <span class="calm-guide__icon" aria-hidden="true"><i class="bi bi-chevron-down"></i></span>
                    <span class="calm-guide__name">Espira</span>
                    <span class="calm-guide__duration">6 secondi</span>
                </li>
            </ol>
        </section>

        <button class="calm-start" id="start-breathing" type="button" aria-pressed="false">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
            Inizia
        </button>

        <dialog class="calm-info" id="calm-info" aria-labelledby="info-title">
            <form method="dialog">
                <button class="calm-info__close" aria-label="Chiudi">×</button>
            </form>
            <h2 id="info-title">Segui il tuo ritmo</h2>
            <p>Inspira per 4 secondi, trattieni per 2 ed espira per 6. Puoi fermarti quando vuoi.</p>
        </dialog>
    </main>

    <div class="waves" aria-hidden="true">
        <img src="../assets/images/waves/wave1.png" class="wave1" alt="">
        <img src="../assets/images/waves/wave2.png" class="wave2" alt="">
        <img src="../assets/images/waves/wave3.png" class="wave3" alt="">
    </div>
</body>

</html>
