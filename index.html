<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="App Bea">

<!-- icona che appare sulla home screen -->
<link rel="apple-touch-icon" href="assets/icons/icona.png">

<!-- collega il manifest -->
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>respira. — uno spazio per te</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/umore.css">
    <link rel="stylesheet" href="assets/css/navbar-glass.css">
    <script type="module" src="assets/js/app.js"></script>
</head>

<body class="home-page">

    <div class="main" id="home-screen">

        <img src="assets/images/illustrations/heart.png" class="heart" alt="">
        <div class="testi">
        <h1 class="bea">Ciao Bea,</h1>
        <h1 class="aiuto">hai bisogno di aiuto?</h1>
    </div>
        <img src="assets/images/illustrations/line.png" class="line" alt="">
        <p class="chill">Se stai avendo un attacco di panico,<br>
sono qui per te. <span> Tranquilla</span>.</p>

        <div class="btncontainer">
            <button class="btn" type="button">Ho bisogno di aiuto</button>

            <div class="tp">
               <span>- </span><p>Tieni premuto</p><span> -</span>
            </div>
        </div>
        
    </div>

    <section class="empty-tab" id="noi-screen" aria-label="Noi" aria-hidden="true"></section>
    <section class="empty-tab mood-screen" id="umore-screen" aria-labelledby="mood-title" aria-hidden="true" inert>
        <div class="mood-content">
            <header class="mood-header">
                <h1 id="mood-title">Il tuo umore 💗</h1>
                <p>Un calendario tutto per te,<br>racconta come ti senti.</p>
            </header>
            <section class="mood-calendar mood-card" aria-label="Calendario dell'umore">
                <div class="mood-calendar__toolbar">
                    <button id="mood-prev" class="mood-month-button" type="button" aria-label="Mese precedente">‹</button>
                    <h2 id="mood-month" aria-live="polite"><i class="bi bi-calendar" aria-hidden="true"></i><span class="mood-month-label"></span></h2>
                    <button id="mood-next" class="mood-month-button" type="button" aria-label="Mese successivo">›</button>
                </div>
                <div class="mood-weekdays" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span></div>
                <div id="mood-days" class="mood-days" role="group" aria-labelledby="mood-month"></div>
            </section>
            <p id="mood-storage-error" class="mood-storage-error" role="alert" hidden></p>
            <section id="mood-panel" class="mood-panel mood-card" aria-label="La giornata selezionata"></section>
            <p id="mood-feedback" class="mood-feedback" role="status" aria-live="polite"></p>
        </div>
    </section>

        <nav class="nav">
            <div class="nav-glass"></div>
             <div class="btn-nav">
                <div class="selettore"></div>

                <div class="noi" role="button" tabindex="0" aria-label="Apri Noi"><i class="bi bi-heart"></i>Noi</div>
                <div class="home active" role="button" tabindex="0" aria-label="Apri Home"><i class="bi bi-house"></i>Home</div>
                <div class="umore" role="button" tabindex="0" aria-label="Apri Umore"><i class="bi bi-brightness-high"></i>Umore</div>
              </div>
        </nav>

    <section class="support-transition" id="support-transition" aria-hidden="true" aria-live="polite">
        <div class="support-transition__content support-transition__content--first">
            <h1 class="support-transition__title">Amore<br>tranquilla,</h1>
            <p class="support-transition__message">va tutto bene</p>
        </div>
        <div class="support-transition__content support-transition__content--second" aria-hidden="true">
            <p class="support-transition__message">Facciamo qualche esercizio<br>insieme.</p>
        </div>
    </section>
    
    <div class="waves">
        <img src="assets/images/waves/wave1.png" class="wave1" alt="">
        <img src="assets/images/waves/wave2.png" class="wave2" alt="">
        <img src="assets/images/waves/wave3.png" class="wave3" alt="">
    </div>

</body>

</html>
